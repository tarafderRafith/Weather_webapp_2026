<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <div class="search-box">
            <i class="fa-solid fa-location-dot"></i>

            <input
                type="text"
                placeholder="Enter city name"
                spellcheck="false"
            >

            <button type="button">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="not-found">
            <img src="images/404.png" alt="City not found">
            <p>Oops! Invalid city name.</p>
        </div>

        <div class="weather-box">
            <img src="" alt="Weather">

            <p class="temperature">
                0<span>°C</span>
            </p>

            <p class="description">
                Weather Description
            </p>
        </div>

        <div class="weather-details">

            <div class="humidity">
                <i class="fa-solid fa-water"></i>

                <div class="text">
                    <span>0%</span>
                    <p>Humidity</p>
                </div>
            </div>

            <div class="wind">
                <i class="fa-solid fa-wind"></i>

                <div class="text">
                    <span>0 Km/h</span>
                    <p>Wind Speed</p>
                </div>
            </div>

        </div>

    </div>

    <!-- JavaScript -->
    <script src="index.js"></script>

</body>
</html>
